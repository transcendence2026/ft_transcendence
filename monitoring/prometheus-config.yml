global:
  scrape_interval:     15s
scrape_configs:
  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']
      # configuración sobre container cAdvisor para monitorear métricas de contenedores y del sistema operativo.
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
    scrape_interval: 5s
      # configuración sobre backend para monitorear métricas de la aplicación backend (metricas de negocio, rendimiento, etc.)