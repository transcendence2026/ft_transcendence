global:
  scrape_interval:     15s
scrape_configs:
  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']
      # cAdvisor container configuration to monitor container and OS metrics.
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
    scrape_interval: 5s
# Backend configuration to monitor application metrics (business metrics, performance, etc.)