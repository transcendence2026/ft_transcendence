events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream backend_upstream {
        server backend:3000;
    }

    # Servidor HTTP: Redirige tráfico del puerto 80 a HTTPS (8443)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # Servidor Principal HTTPS
    server {
        listen 443 ssl;
        server_name localhost;

        # Certificados SSL montados desde proxy/certs
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Redirigir peticiones HTTP directas al puerto HTTPS (error 497)
        error_page 497 https://$host:8443$request_uri;

        root /usr/share/nginx/html;
        index index.html;

        # PWA: Evitar que el navegador guarde en caché el Service Worker
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            try_files $uri =404;
        }

        # Archivos subidos compartidos con el backend
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            autoindex off;
        }

        # Proxy inverso para endpoints REST de NestJS
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Proxy inverso para WebSockets
        location /ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Enrutamiento SPA (Vite / React Router)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}