events {}

http {
    # Imprescindible para servir JS, CSS y manifiestos con su Content-Type correcto
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirección de tráfico HTTP plano al puerto seguro HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # Servidor seguro HTTPS
    server {
        listen 443 ssl;
        server_name _;

        # Certificados SSL con extensión SAN
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Redirige si alguien entra por HTTP en el puerto 8443
        error_page 497 https://$host:8443$request_uri;

        # Límite de subida (avatares e imágenes)
        client_max_body_size 10M;

        # 1. Frontend compilado (Single Page Application)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Service Worker de la PWA (evita caché rígida para que siempre actualice)
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # 3. Proxy hacia los endpoints del Backend
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 4. Proxy de WebSockets
        location /ws/ {
            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 5. Archivos multimedia y avatares subidos
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}