events {}

http {
    # Redirect all plain HTTP traffic to the encrypted HTTPS endpoint.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Serve the application through HTTPS using the mounted certificate files.
    server {
        listen 443 ssl;
        server_name _;

        # Self-signed certificates are suitable for local development only.
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Allow request bodies up to 10 MB, including profile image uploads.
        client_max_body_size 10M;   # Increase this limit if larger uploads are required.

        # Frontend Vite development server with HMR and WebSocket support.
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;

            # Forward upgrade headers so Vite HMR and other WebSocket clients work.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Forward REST API requests to the backend application.
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            # Preserve the client's original IP for backend logging and checks.
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Forward real-time WebSocket traffic to the backend gateway.
        location /ws/ {
            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Serve uploaded files directly from the shared uploads directory.
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            # Cache uploaded images in the browser for seven days.
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}